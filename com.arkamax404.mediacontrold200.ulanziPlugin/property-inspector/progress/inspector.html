<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Progress</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 14px; background: #1e1f22; color: #f5f5f5; }
    form { display: grid; gap: 12px; }
    label { display: grid; grid-template-columns: 120px 42px minmax(88px, 1fr); gap: 8px; align-items: center; }
    input, select { box-sizing: border-box; min-height: 30px; border: 1px solid #555; border-radius: 4px; background: #2b2d31; color: #fff; }
    input[type="color"] { width: 42px; padding: 2px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 4px 7px; }
    .hint { margin: 0; color: #b5bac1; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <form id="progress-settings" autocomplete="off">
    <label>Progress <input type="color" name="progressColor" value="#1DB954"><input type="text" name="progressColorHex" value="#1DB954" maxlength="7" pattern="#[0-9A-Fa-f]{6}" aria-label="Progress color HEX"></label>
    <label>Track <input type="color" name="trackColor" value="#333333"><input type="text" name="trackColorHex" value="#333333" maxlength="7" pattern="#[0-9A-Fa-f]{6}" aria-label="Track color HEX"></label>
    <label>Text <input type="color" name="textColor" value="#FFFFFF"><input type="text" name="textColorHex" value="#FFFFFF" maxlength="7" pattern="#[0-9A-Fa-f]{6}" aria-label="Text color HEX"></label>
    <label>Background <input type="color" name="backgroundColor" value="#000000"><input type="text" name="backgroundColorHex" value="#000000" maxlength="7" pattern="#[0-9A-Fa-f]{6}" aria-label="Background color HEX"></label>
    <label>Stroke width <span></span><input type="number" name="strokeWidth" value="14" min="6" max="30" step="1"></label>
    <p class="hint">HEX fields remain available when Studio does not open the native color picker.</p>
  </form>
  <script src="../../vendor/ulanzi-sdk/html/js/constants.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/eventEmitter.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/timers.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/utils.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/ulanziApi.js"></script>
  <script type="module" src="inspector.js"></script>
</body>
</html>

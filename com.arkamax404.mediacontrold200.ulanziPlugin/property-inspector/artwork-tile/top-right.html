<!doctype html>
<html lang="en" data-action="artwork-top-right">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Artwork Tile Action</title>
  <style>:root{color-scheme:dark;font-family:Arial,sans-serif}body{margin:0;padding:14px;background:#1e1f22;color:#f5f5f5}form,.fields{display:grid;gap:10px}label{font-size:13px;font-weight:700}select,input{box-sizing:border-box;width:100%;min-height:34px;padding:4px 8px;border:1px solid #555;border-radius:4px;background:#2b2d31;color:#fff}.color-row{display:grid;grid-template-columns:44px 1fr;gap:8px}input[type=color]{padding:2px}.hint{margin:0;color:#b5bac1;font-size:12px;line-height:1.4}</style>
</head>
<body><form autocomplete="off"><label for="secondary-action">On press</label><select id="secondary-action"><option value="none">None</option><option value="previous">Previous</option><option value="toggle">Play/Pause</option><option value="next">Next</option><option value="volume-up">Volume Up</option><option value="volume-down">Volume Down</option><option value="mute-toggle">Mute Toggle</option></select><div id="audio-source-fields" class="fields" hidden><label for="audio-target">Audio source</label><select id="audio-target"></select><p class="hint">Shows currently active Windows audio sources.</p></div><label for="badge-color">Badge color</label><div class="color-row"><input id="badge-color" type="color" value="#1DB954" aria-label="Badge color picker"><input id="badge-color-hex" type="text" value="#1DB954" maxlength="7" pattern="#[0-9A-Fa-f]{6}" aria-label="Badge color hexadecimal value"></div><p class="hint">Applied independently to this tile. Default: #1DB954.</p><p class="hint">The tile keeps displaying its artwork quadrant.</p></form>
  <script src="../../vendor/ulanzi-sdk/html/js/constants.js"></script><script src="../../vendor/ulanzi-sdk/html/js/eventEmitter.js"></script><script src="../../vendor/ulanzi-sdk/html/js/timers.js"></script><script src="../../vendor/ulanzi-sdk/html/js/utils.js"></script><script src="../../vendor/ulanzi-sdk/html/js/ulanziApi.js"></script><script type="module" src="inspector.js"></script></body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup Large Display</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 14px; background: #1e1f22; color: #f5f5f5; }
    .card { padding: 14px; border: 1px solid #4b4d52; border-radius: 8px; background: #2b2d31; }
    #status { margin: 0 0 7px; color: #1db954; font-size: 18px; font-weight: 700; }
    #reason, .hint { margin: 0; color: #d6d8dc; font-size: 13px; line-height: 1.45; }
    .hint { margin-top: 12px; color: #aeb2b8; }
    label { display: grid; gap: 6px; margin-top: 14px; font-size: 13px; }
    select { min-height: 32px; border: 1px solid #555; border-radius: 4px; background: #1e1f22; color: #fff; }
  </style>
</head>
<body>
  <section class="card" aria-live="polite">
    <h1 id="status">Ready</h1>
    <p id="reason">Press the assigned D200 key to verify this page.</p>
    <p id="profile" class="hint"></p>
    <label>Operation
      <select id="operation">
        <option value="install">Install</option>
        <option value="repair">Repair</option>
        <option value="restore">Restore original</option>
      </select>
    </label>
  </section>
  <p class="hint">Press the assigned D200 key, then close Studio only when the status asks you to.</p>
  <script src="../../vendor/ulanzi-sdk/html/js/constants.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/eventEmitter.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/timers.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/utils.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/ulanziApi.js"></script>
  <script type="module" src="inspector.js"></script>
</body>
</html>

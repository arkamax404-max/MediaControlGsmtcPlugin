<!doctype html>
<html lang="en" data-action="mute-toggle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Source</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 14px; background: #1e1f22; color: #f5f5f5; }
    form { display: grid; gap: 10px; }
    label { font-size: 13px; font-weight: 700; }
    select { box-sizing: border-box; width: 100%; min-height: 34px; padding: 4px 8px; border: 1px solid #555; border-radius: 4px; background: #2b2d31; color: #fff; }
    .hint { margin: 0; color: #b5bac1; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <form id="mute-settings" autocomplete="off">
    <label for="audio-target">Audio source</label>
    <select id="audio-target" name="audioTarget" aria-describedby="source-hint"></select>
    <p id="source-hint" class="hint">Shows the system volume and audio sources currently active in Windows.</p>
  </form>
  <script src="../../vendor/ulanzi-sdk/html/js/constants.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/eventEmitter.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/timers.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/utils.js"></script>
  <script src="../../vendor/ulanzi-sdk/html/js/ulanziApi.js"></script>
  <script type="module" src="inspector.js"></script>
</body>
</html>
